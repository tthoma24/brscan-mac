# brscan-scand configuration (synthetic sample, fully specified, for
# DaemonConfig round-trip tests only). Every key DaemonConfig owns has an
# explicit line below, each already spelled exactly as ConfigDocument's
# setValue() would write it ("key = value"), so applying an unchanged
# DaemonConfig parsed from this file back onto it changes nothing.
#
# No real device identity -- BRW00AABBCCDDEE is a synthetic placeholder.

printer_host = BRW00AABBCCDDEE.local
display_name = Test Mac
save_dir = ~/Scans

file.mode = color
file.dpi = 300
file.source = flatbed
file.format = pdf
file.tiff_compression = lzw
file.separation = combine
file.paper = LETTER
file.high_speed = off
file.skip_blank = off

image.mode = gray
image.dpi = 200
image.source = adf
image.format = jpeg
image.tiff_compression = lzw
image.separation = combine
image.paper = A5
image.high_speed = on
image.skip_blank = off

ocr.mode = bw
ocr.dpi = 300
ocr.source = adf-duplex
ocr.format = pdf
ocr.tiff_compression = lzw
ocr.separation = page:2
ocr.paper = A3
ocr.ocr_format = pdf
ocr.high_speed = off
ocr.skip_blank = on

email.mode = truegray
email.dpi = 150
email.source = flatbed
email.format = tiff
email.tiff_compression = g4
email.separation = combine
email.paper = A4
email.high_speed = off
email.skip_blank = off

image_app = Preview
email_to = someone@example.com

# unrelated key this editor doesn't know about
some.unknown = key
