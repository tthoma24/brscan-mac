# brscan-scand configuration (synthetic sample, for tests only).
#
# Lines are `key = value`; blank lines and lines starting with `#` are
# ignored. Whitespace around the key and value is trimmed. This fixture
# uses only synthetic values -- no real device identity.

# --- Required ---------------------------------------------------------------

printer_host = BRW00AABBCCDDEE.local

# --- General ----------------------------------------------------------------

display_name = Test Mac
save_dir = ~/Scans

# --- Per-destination scan settings ------------------------------------------

file.mode = color
file.dpi = 300
file.source = flatbed

# image.mode = color
# image.dpi = 300

ocr.mode = gray
ocr.dpi =    300
ocr.source = adf

# --- Per-destination output format -------------------------------------------

file.format = pdf
file.separation = every:1

# --- Per-destination paper size ----------------------------------------------

file.paper = LETTER

# --- Destination action settings --------------------------------------------

# image_app = Preview
email_to = someone@example.com
