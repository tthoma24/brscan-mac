# brscan-scand configuration (synthetic sample, for DaemonConfig tests only).
#
# No real device identity -- BRW00AABBCCDDEE is a synthetic placeholder, per
# docs/BUTTON.md-style examples elsewhere in this repo.

printer_host = BRW00AABBCCDDEE.local
display_name = Test Mac
save_dir = ~/Scans

# --- file: fully specified ---------------------------------------------
file.mode = color
file.dpi = 300
file.source = flatbed
file.format = pdf
file.tiff_compression = lzw
file.separation = combine
file.paper = LETTER

# --- image: partially specified (format/tiff_compression/separation/paper
# left to their defaults) -----------------------------------------------
image.mode = gray
image.dpi = 200
image.source = adf

# --- ocr: a couple of overrides, rest defaulted -------------------------
ocr.mode = bw
ocr.source = adf-duplex
ocr.separation = page:2

# --- email: mostly defaulted, one malformed value -----------------------
email.mode = truegray
email.dpi = abc
email.format = tiff
email.tiff_compression = g4

image_app = Preview
email_to = someone@example.com

# a key this editor doesn't know about, must survive untouched
some.unknown = key
